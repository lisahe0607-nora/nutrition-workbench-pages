","C"],"rawAnswer":"ABC","pages":[167],"notes":[]},{"id":"multiple-224","type":"multiple","number":224,"stem":"新鲜蔬菜中硝酸盐的含量多时，会引起哪些问题？（ ）","options":[{"label":"A","text":"作物的凋谢枯萎"},{"label":"B","text":"人畜食用后就会引起中毒"},{"label":"C","text":"瓜果类（如黄瓜）"},{"label":"D","text":"豆类（如豌豆）"}],"answer":["A","B"],"rawAnswer":"AB","pages":[167],"notes":[]},{"id":"multiple-225","type":"multiple","number":225,"stem":"农药残留的来源是（ ）","options":[{"label":"A","text":"直接施用的农药"},{"label":"B","text":"从污染环境中吸收"},{"label":"C","text":"牲畜的粪便"},{"label":"D","text":"害虫"}],"answer":["A","B"],"rawAnswer":"AB","pages":[167],"notes":[]},{"id":"multiple-226","type":"multiple","number":226,"stem":"以下哪些行为属于掺伪？（ ）","options":[{"label":"A","text":"将陈小米洗后染色冒充新小米"},{"label":"B","text":"在米粉和粉丝中加入有毒的荧光增白剂"},{"label":"C","text":"将抽出面筋后面粉冒充面粉或混入好面粉中出售。"},{"label":"D","text":"在糯米中掺入大米"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[168],"notes":[]},{"id":"multiple-227","type":"multiple","number":227,"stem":"以下哪些是粮豆类食品的主要卫生问题？（ ）","options":[{"label":"A","text":"有毒有害物质的污染"},{"label":"B","text":"农药残留"},{"label":"C","text":"腐败变质"},{"label":"D","text":"真菌和真菌毒素的污染"}],"answer":["A","B","D"],"rawAnswer":"ABD","pages":[168],"notes":[]},{"id":"multiple-228","type":"multiple","number":228,"stem":"以下情形可豁免强制标示营养标签的是？（ ）","options":[{"label":"A","text":"生鲜食品（如袋装冻虾）"},{"label":"B","text":"食用量≤10g/mL 的调味品（如食用盐）"},{"label":"C","text":"酒精含量≥0.5% 的饮料"},{"label":"D","text":"现制现售食品"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[168],"notes":[]},{"id":"multiple-229","type":"multiple","number":229,"stem":"营养标签中必须包含的组成部分有哪些？（ ）","options":[{"label":"A","text":"营养成分表"},{"label":"B","text":"营养声称"},{"label":"C","text":"配料表"},{"label":"D","text":"营养素参考值百分比（NRV%）"}],"answer":["A","D"],"rawAnswer":"AD","pages":[168,169],"notes":[]},{"id":"multiple-230","type":"multiple","number":230,"stem":"使用了营养强化剂的食品，标签需额外标示哪些信息？（ ）","options":[{"label":"A","text":"强化后营养素的含量"},{"label":"B","text":"该营养素占 NRV 的百分比"},{"label":"C","text":"强化剂 },{"label":"C","text":"开展食品安全宣教工作"},{"label":"D","text":"立即销毁所有可疑食品"}],"answer":["A","B","C"],"rawAnswer":"ABC","pages":[172],"notes":[]},{"id":"multiple-245","type":"multiple","number":245,"stem":"以下属于《食品安全法》制定宗旨和原则的是（ ）","options":[{"label":"A","text":"保障公众身体健康"},{"label":"B","text":"科学合理"},{"label":"C","text":"安全可靠"},{"label":"D","text":"公平竞争"}],"answer":["A","B","C"],"rawAnswer":"ABC","pages":[173],"notes":[]},{"id":"multiple-246","type":"multiple","number":246,"stem":"禁止生产经营的食品包括（ ）","options":[{"label":"A","text":"添加违禁成分的食品"},{"label":"B","text":"超过保质期的食品"},{"label":"C","text":"无标签的预包装食品"},{"label":"D","text":"未按规定检疫的肉类"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[173],"notes":[]},{"id":"multiple-247","type":"multiple","number":247,"stem":"食品安全标准包括以下哪些内容？（ ）","options":[{"label":"A","text":"食品添加剂的品种、使用范围、用量"},{"label":"B","text":"食品生产经营过程的卫生要求"},{"label":"C","text":"与食品安全有关的质量要求"},{"label":"D","text":"食品相关产品中的致病性微生物、农药残留、兽药残留、生物毒素、重金属等污染物质以及其他危害人体健康物质的限量规定"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[173],"notes":[]},{"id":"multiple-248","type":"multiple","number":248,"stem":"以下什么情况下，食品生产经营者需要召回食品（普通预包装食品）？","options":[{"label":"A","text":"发现其生产的食品不符合食品安全标准"},{"label":"B","text":"有证据证明可能危害人体健康的食品"},{"label":"C","text":"食品含有反式脂肪酸"},{"label":"D","text":"食品包装无营养成分表"}],"answer":["A","B"],"rawAnswer":"AB","pages":[173,174],"notes":[]},{"id":"multiple-249","type":"multiple","number":249,"stem":"预包装食品标签强制标示内容有（ ）","options":[{"label":"A","text":"成分或配料表"},{"label":"B","text":"生产日期和保质期"},{"label":"C","text":"生产者名称及地址"},{"label":"D","text":"营养成分表"}],"answer":["A","B","C"],"rawAnswer":"ABC","pages":[174],"notes":[]},{"id":"multiple-250","type":"multiple","number":250,"stem":"以下哪些对特殊食品的描述正确？（ ）","options":[{"label":"A","text":"保健食品是特殊食品"},{"label":"B","text":"婴幼儿食品是特殊食品"},{"label":"C","text":"特殊医学用途配方食品是特殊食品"},{"label":"D","text":"国家对特殊食品实施严格监管"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[174],"notes":[]},{"id":"multiple-251","type":"multiple","number":251,"stem":"对于《食品营养强化剂使用标准》中的附录 B 的描述正确的是（ ）","options":[{"label":"A","text":"允许强化的食品类别和使用量"},{"label":"B","text":"一个可使用的营养强化剂可有多个化合物来源"},{"label":"C","text":"允许使用的营养强化剂的化合物来源名单"},{"label":"D","text":"允许用于特殊膳食用食品的营养强化剂及化合物来源"}],"answer":["B","C"],"rawAnswer":"BC","pages":[174],"notes":[]},{"id":"multiple-252","type":"multiple","number":252,"stem":"选择营养强化剂时需满足的要求包括（ ）","options":[{"label":"A","text":"稳定性高"},{"label":"B","text":"不导致任何营养素及其他营养物质的代谢异常"},{"label":"C","text":"价格低廉"},{"label":"D","text":"不导致食品一般特性如色泽、滋味、气味、烹调特性等发生明显不良改变。"}],"answer":["A","B","D"],"rawAnswer":"ABD","pages":[174,175],"notes":[]},{"id":"multiple-253","type":"multiple","number":253,"stem":"食品营养强化的基本要求包括（ ）","options":[{"label":"A","text":"有明确的针对性人群"},{"label":"B","text":"符合营养学原理"},{"label":"C","text":"添加量越高越好"},{"label":"D","text":"不影响食品原有风味"}],"answer":["A","B","D"],"rawAnswer":"ABD","pages":[175],"notes":[]},{"id":"multiple-254","type":"multiple","number":254,"stem":"可强化食品类别的选择原则和使用包括（ ）","options":[{"label":"A","text":"载体为日常广泛消费食品"},{"label":"B","text":"强化后不易导致营养素过量摄入"},{"label":"C","text":"仅限于高端功能性食品"},{"label":"D","text":"可与药品重叠使用"}],"answer":["A","B"],"rawAnswer":"AB","pages":[175],"notes":[]},{"id":"multiple-255","type":"multiple","number":255,"stem":"对食物进行称重时要准确掌握两方面的资料，具体包括（）","options":[{"label":"A","text":"厨房中每餐所用各种食物的生熟重量比值"},{"label":"B","text":"称量个人所摄入熟食的重量，再计算出每人每日对各种生重食物的摄入量"},{"label":"C","text":"所消费的食物的品种"},{"label":"D","text":"所消费的食物的价格"}],"answer":["A","B"],"rawAnswer":"AB","pages":[175],"notes":[]},{"id":"multiple-256","type":"multiple","number":256,"stem":"利用称重法进行膳食调查时，以下说法正确的是（）","options":[{"label":"A","text":"统计每餐就餐人数，并记录到食物摄入量记录表内"},{"label":"B","text":"进餐人员的组成在年龄、性别和劳动强度上差别不大时，可不做个人进餐记录"},{"label":"C","text":"如果年龄和劳动强度相差很大时，则必须算出相应 “标准人” 的每人每日营养素摄入量"},{"label":"D","text":"每人每日食物平均摄入量 = 各种食物消费量 / 总就餐人数"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[175,176],"notes":[]},{"id":"multiple-257","type":"multiple","number":257,"stem":"关于称重法的特点和说法，正确的是（）","options":[{"label":"A","text":"优点是简便、快速，但不够准确"},{"label":"B","text":"适合做大规模的营养调查"},{"label":"C","text":"适用于个人和家庭或团体的膳食调查"},{"label":"D","text":"能够准确反映调查对象的食物摄入情况"}],"answer":["C","D"],"rawAnswer":"CD","pages":[176],"notes":[]},{"id":"multiple-258","type":"multiple","number":258,"stem":"称重记录表的设计原则包含以下哪些内容","options":[{"label":"A","text":"餐次分开"},{"label":"B","text":"必须只用 1 种格式"},{"label":"C","text":"记录煮熟的食物量"},{"label":"D","text":"项目完整、清晰"},{"label":"E","text":"足够的记录空间"}],"answer":["A","D","E"],"rawAnswer":"ADE","pages":[176],"notes":[]},{"id":"multiple-259","type":"multiple","number":259,"stem":"称重记录表如果收集群体信息，除了要记录食物重量，还要记录以下哪些基本情况","options":[{"label":"A","text":"实际消费食物的人数"},{"label":"B","text":"消费者的年龄和性别"},{"label":"C","text":"消费者的体力活动"},{"label":"D","text":"消费者的收入水平"},{"label":"E","text":"其他可能影响食物摄入量的基本情况"}],"answer":["A","B","C","E"],"rawAnswer":"ABCE","pages":[176,177],"notes":[]},{"id":"multiple-260","type":"multiple","number":260,"stem":"称重记录表的设计方法包括以下哪些方面","options":[{"label":"A","text":"确定要记录的是针对个体还是群体的信息"},{"label":"B","text":"确定要得到的是关于食物的还是营养素信息"},{"label":"C","text":"确定膳食记录的天数"},{"label":"D","text":"确定在家中还是在单位食堂消费的食物"},{"label":"E","text":"确定使用非开放式记录表还是开放式记录表"}],"answer":["A","B","C","D","E"],"rawAnswer":"ABCDE","pages":[177],"notes":[]},{"id":"multiple-261","type":"multiple","number":261,"stem":"通过膳食调查收集到了调查对象摄入的食物名称和摄入的量，通过计算可以获得以下哪些信息？（）","options":[{"label":"A","text":"摄入的食物种类"},{"label":"B","text":"谷物类食物的摄入总量"},{"label":"C","text":"蛋白质摄入量"},{"label":"D","text":"锌的摄入量"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[177],"notes":[]},{"id":"multiple-262","type":"multiple","number":262,"stem":"在采用称重法对个体进行了 1 日的膳食调查后，可以知道这个人 1 日内（）","options":[{"label":"A","text":"消费的食物价格"},{"label":"B","text":"购买食物的渠道"},{"label":"C","text":"消费的食物种类"},{"label":"D","text":"食物的消费量"}],"answer":["C","D"],"rawAnswer":"CD","pages":[177],"notes":[]},{"id":"multiple-263","type":"multiple","number":263,"stem":"在计算膳食中各类食物的摄入量时，需要做以下哪些事情？","options":[{"label":"A","text":"对某个体 1 日内所消费的食物名称和重量做好记录"},{"label":"B","text":"根据记录对 1 日内消费的食物进行归类排序，并列出每种食物的消费重量"},{"label":"C","text":"把每一类中不同种食物的重量作求和计算，作为这一类食物的摄入量"},{"label":"D","text":"将记录的食物按照《中国食物成分表》的 21 类进行归类"}],"answer":["A","B","C"],"rawAnswer":"ABC","pages":[177,178],"notes":[]},{"id":"multiple-264","type":"multiple","number":264,"stem":"苹果的可食部是 76%，表明（）","options":[{"label":"A","text":"100 g 苹果中，可食用部分的重量为 76g"},{"label":"B","text":"应该丢弃的是 76%"},{"label":"C","text":"废弃率为 24%"},{"label":"D","text":"100 g 苹果中，被丢弃不能食用的重量为 24 g"}],"answer":["A","C","D"],"rawAnswer":"ACD","pages":[178],"notes":[]},{"id":"multiple-265","type":"multiple","number":265,"stem":"关于食物可食部的说法，以下正确的是（）","options":[{"label":"A","text":"可食部的数值表示每 100g 食物中可以食用部分占该食物的比例"},{"label":"B","text":"食物成分表中所有食物的可食部均为 100%"},{"label":"C","text":"食物的可食部和食物的废弃率是一个相对的概念"},{"label":"D","text":"精细加工可以减少可食用部分的比例"}],"answer":["A","C"],"rawAnswer":"AC","pages":[178],"notes":[]},{"id":"multiple-266","type":"multiple","number":266,"stem":"膳食调查中应用食物的可食部，以下说法正确的是（）","options":[{"label":"A","text":"可以通过直接查《中国食物成分表》获得 “可食部” 数值"},{"label":"B","text":"一个苹果，去皮和核后为废弃部分，皮和核的重量为可食用部分"},{"label":"C","text":"膳食调查时如果调查对象提供的食物摄入量不是净重，则需要乘以可食部"},{"label":"D","text":"食物的可食部会因季节、运输方式、储藏和加工处理等的不同而有所差异"}],"answer":["A","C","D"],"rawAnswer":"ACD","pages":[178],"notes":[]},{"id":"multiple-267","type":"multiple","number":267,"stem":"关于生熟比值，以下说法正确的是（）","options":[{"label":"A","text":"一般烹调后失重的食物常计算生熟比值"},{"label":"B","text":"食物烹调前后重量的变化将直接影响营养素含量的变化"},{"label":"C","text":"生熟比值的计算公式为：食物的生熟重量比值 = 生食物重量 / 熟食物重量"},{"label":"D","text":"不同产地的大米其生熟重量比值也不同"}],"answer":["B","C","D"],"rawAnswer":"BCD","pages":[179],"notes":[]},{"id":"multiple-268","type":"multiple","number":268,"stem":"关于食物烹饪，以下说法正确的是（）","options":[{"label":"A","text":"烹调过程中理化改变非常简单"},{"label":"B","text":"烹调是人类文明进步的标志"},{"label":"C","text":"食物烹调前后各种营养成分不会变化"},{"label":"D","text":"烹调提升了食物的品质"}],"answer":["B","D"],"rawAnswer":"BD","pages":[179],"notes":[]},{"id":"multiple-269","type":"multiple","number":269,"stem":"膳食调查的内容，包含下面哪些方面？","options":[{"label":"A","text":"调查期间每人每日所摄入的食物品种和数量"},{"label":"B","text":"了解食物原料烹调加工方法"},{"label":"C","text":"了解饮食制度、餐次分配"},{"label":"D","text":"调查对象几天或一段时间的膳食情况"},{"label":"E","text":"调查对象的饮食习惯和基本信息"}],"answer":["A","B","C","D","E"],"rawAnswer":"ABCDE","pages":[179],"notes":[]},{"id":"multiple-270","type":"multiple","number":270,"stem":"以下哪些属于最常见的膳食调查方法？","options":[{"label":"A","text":"小组讨论"},{"label":"B","text":"称重法"},{"label":"C","text":"膳食史法"},{"label":"D","text":"记账法"},{"label":"E","text":"食物计算法"}],"answer":["B","C","D"],"rawAnswer":"BCD","pages":[179,180],"notes":[]},{"id":"multiple-271","type":"multiple","number":271,"stem":"以下关于食物的份的说法，正确的是（）","options":[{"label":"A","text":"食物的份是指单位食物或常用单位量具中食物具体的数量份额"},{"label":"B","text":"食物的份额通常是根据能量值确定的"},{"label":"C","text":"一袋牛奶约 250mL，指的是单位食物份的重量"},{"label":"D","text":"若食物重量不实，将导致膳食调查的数据不准确或失败"}],"answer":["A","C","D"],"rawAnswer":"ACD","pages":[180],"notes":[]},{"id":"multiple-272","type":"multiple","number":272,"stem":"计算一份菜肴中各类食物主要营养素摄入量的计算步骤，主要包括下面哪些方面？","options":[{"label":"A","text":"从《中国食物成分表》中查询出各种食物的营养素含量"},{"label":"B","text":"分别各类食物所含能量和营养素的量"},{"label":"C","text":"对于《中国食物成分表》中查不到的食物进行删除"},{"label":"D","text":"把所有食物提供的能量和营养素含量相加"}],"answer":["A","B","D"],"rawAnswer":"ABD","pages":[180],"notes":[]},{"id":"multiple-273","type":"multiple","number":273,"stem":"以下关于膳食营养素摄入量计算的描述，正确的有哪些？","options":[{"label":"A","text":"不能采用熟食编码，只能采用食物成分表中的生重进行计算"},{"label":"B","text":"如果记录的食物是毛重，直接乘以食物成分表中的营养素含量即可"},{"label":"C","text":"对食物成分表中查不到的食物，可以用近似食物的营养成分代替"},{"label":"D","text":"烹调过程对原料中的营养素种类和数量有一定影响"},{"label":"E","text":"豆类制品需要折算成大豆的量，再相加"}],"answer":["C","D","E"],"rawAnswer":"CDE","pages":[180],"notes":[]},{"id":"multiple-274","type":"multiple","number":274,"stem":"在对消费的食物进行归类并计算摄入量时，以下哪些食物需要折算后才能再相加？","options":[{"label":"A","text":"鲜奶"},{"label":"B","text":"南豆腐"},{"label":"C","text":"酸奶"},{"label":"D","text":"大豆"},{"label":"E","text":"奶粉"}],"answer":["B","C","E"],"rawAnswer":"BCE","pages":[180,181],"notes":[]},{"id":"multiple-275","type":"multiple","number":275,"stem":"膳食食物能量的数值可以通过两种方法获得","options":[{"label":"A","text":"直接测定法"},{"label":"B","text":"调查对象自报"},{"label":"C","text":"能量计算法"},{"label":"D","text":"膳食调查表记录"}],"answer":["A","C"],"rawAnswer":"AC","pages":[181],"notes":[]},{"id":"multiple-276","type":"multiple","number":276,"stem":"在食物热量和营养学领域，将 1000 克水在 1 大气压下升高 1 摄氏度所需要的热量通常定义为（）","options":[{"label":"A","text":"1 卡路里"},{"label":"B","text":"1 千卡"},{"label":"C","text":"1 大卡"},{"label":"D","text":"1 Cal"},{"label":"E","text":"1 kcal"}],"answer":["A","B","C","D","E"],"rawAnswer":"ABCDE","pages":[181],"notes":[]},{"id":"multiple-277","type":"multiple","number":277,"stem":"在计算能量时，关于各营养素提供能量的描述正确的是？","options":[{"label":"A","text":"蛋白质的能量折算系数为 4 kcal/g"},{"label":"B","text":"能量折算系数最高的是脂肪"},{"label":"C","text":"每克膳食纤维提供的能量为 2 kcal"},{"label":"D","text":"酒精不提供能量"}],"answer":["A","B","C"],"rawAnswer":"ABC","pages":[181,182],"notes":[]},{"id":"multiple-278","type":"multiple","number":278,"stem":"中国居民膳食营养素参考摄入量为一系列评价膳食质量的参考值，包含以下哪些项目？","options":[{"label":"A","text":"EAR"},{"label":"B","text":"RNI"},{"label":"C","text":"AI"},{"label":"D","text":"UL"},{"label":"E","text":"RDAs"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[182],"notes":[]},{"id":"multiple-279","type":"multiple","number":279,"stem":"我国当前常用的国家食物成分表出版物包括以下哪三种？","options":[{"label":"A","text":"《食物成分表》 （全国代表值）"},{"label":"B","text":"《中国食物成分表》 （标准版）"},{"label":"C","text":"《食物营养成分速查》"},{"label":"D","text":"用于普及知识的简要本"}],"answer":["B","C","D"],"rawAnswer":"BCD","pages":[182],"notes":[]},{"id":"multiple-280","type":"multiple","number":280,"stem":"以下关于食物编码的说法正确的是（）","options":[{"label":"A","text":"编码采取 6 位数字"},{"label":"B","text":"前 2 位数字是食物的类别编码"},{"label":"C","text":"第 3 位数字是食物的亚类编码"},{"label":"D","text":"最后 3 位数字是食物在亚类中的排列序号"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[182],"notes":[]},{"id":"multiple-281","type":"multiple","number":281,"stem":"在《中国食物成分表》中，关于数据表达的说法正确的是（）","options":[{"label":"A","text":"在国家食物数据库中，数据表达形式可以随意变动"},{"label":"B","text":"符号 “-“表示未实际检测"},{"label":"C","text":"符号 “Tr“表示微量"},{"label":"D","text":"（0）表示检测值为 0"},{"label":"E","text":"Un 表示不能计算"}],"answer":["B","C","E"],"rawAnswer":"BCE","pages":[183],"notes":[]},{"id":"multiple-282","type":"multiple","number":282,"stem":"围度测量前的准备工作包括（）","options":[{"label":"A","text":"选择安静、私密、温度适宜的环境"},{"label":"B","text":"被测者着装轻薄单层、赤足、去除厚重饰品"},{"label":"C","text":"被测者平静呼吸、自然站立、放松"},{"label":"D","text":"准备纸质或电子记录表"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[183],"notes":[]},{"id":"multiple-283","type":"multiple","number":283,"stem":"胸围测量的注意事项有（）","options":[{"label":"A","text":"软尺轻轻接触皮肤，避免过松或过紧"},{"label":"B","text":"被测者需保持挺胸、收腹的标准姿势"},{"label":"C","text":"肩胛下角摸不清时，可令被测者挺胸摸清后恢复正确姿势"},{"label":"D","text":"需双人协作，一人前方测量，一人后方协助定位和观察姿势"}],"answer":["A","C","D"],"rawAnswer":"ACD","pages":[183],"notes":[]},{"id":"multiple-284","type":"multiple","number":284,"stem":"腰围测量的 “雷区” 包括（）","options":[{"label":"A","text":"测量肚脐水平"},{"label":"B","text":"软尺保持水平且轻轻贴肤"},{"label":"C","text":"被测者刻意收腹或鼓肚"},{"label":"D","text":"在吸气时测量"}],"answer":["A","C","D"],"rawAnswer":"ACD","pages":[183,184],"notes":[]},{"id":"multiple-285","type":"multiple","number":285,"stem":"关于腰臀比（WHR） ，说法正确的有（）","options":[{"label":"A","text":"计算公式为腰围 ÷ 臀围"},{"label":"B","text":"评估腹型肥胖和体型分布的重要指标"},{"label":"C","text":"男性 WHR≥0.9 提示腹型肥胖风险"},{"label":"D","text":"女性 WHR≥0.85 提示腹型肥胖风险"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[184],"notes":[]},{"id":"multiple-286","type":"multiple","number":286,"stem":"围度测量的质量控制措施包括（）","options":[{"label":"A","text":"定期校准测量软尺，误差＞0.5cm 即废弃"},{"label":"B","text":"严格遵循标准化操作程序（SOP）"},{"label":"C","text":"测量人员需通过一致性考核"},{"label":"D","text":"保证测量环境和被测者着装恒定"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[184],"notes":[]},{"id":"multiple-287","type":"multiple","number":287,"stem":"杠杆式体重计使用前的检查，正确的有（）","options":[{"label":"A","text":"放置平坦地面"},{"label":"B","text":"指针调零"},{"label":"C","text":"用 200g 砝码试灵敏度"},{"label":"D","text":"检查踏板挂钩连接"},{"label":"E","text":"准备标准砝码"}],"answer":["A","B","D","E"],"rawAnswer":"ABDE","pages":[184],"notes":[]},{"id":"multiple-288","type":"multiple","number":288,"stem":"儿童身高测量时必须满足的姿势要点包括（）","options":[{"label":"A","text":"足跟并拢"},{"label":"B","text":"骶部紧靠立柱"},{"label":"C","text":"两眼向上仰视"},{"label":"D","text":"耳屏上缘与眼眶下缘连线与立柱垂直"},{"label":"E","text":"两臂自然下垂"}],"answer":["A","B","D","E"],"rawAnswer":"ABDE","pages":[184,185],"notes":[]},{"id":"multiple-289","type":"multiple","number":289,"stem":"儿童生长发育体格测量 “主要指标” 有（）","options":[{"label":"A","text":"体重"},{"label":"B","text":"身高"},{"label":"C","text":"坐高"},{"label":"D","text":"头围"},{"label":"E","text":"胸围"}],"answer":["A","B","D","E"],"rawAnswer":"ABDE","pages":[185],"notes":[]},{"id":"multiple-290","type":"multiple","number":290,"stem":"儿童坐高测量正确坐姿要求有（）","options":[{"label":"A","text":"大腿与躯体成直角"},{"label":"B","text":"膝关节屈曲成直角"},{"label":"C","text":"脚尖自然向前"},{"label":"D","text":"臀部尽量远离量板"},{"label":"E","text":"躯干自然挺直"}],"answer":["A","B","C","E"],"rawAnswer":"ABCE","pages":[185],"notes":[]},{"id":"multiple-291","type":"multiple","number":291,"stem":"儿童体格围度测量的意义包括（）","options":[{"label":"A","text":"辅助发现佝偻病"},{"label":"B","text":"筛查脑积水、巨脑畸形等疾病"},{"label":"C","text":"反映胸腔容积和呼吸器官发育程度"},{"label":"D","text":"评估颅脑发育状况"},{"label":"E","text":"结合身高体重全面评价生长发育"}],"answer":["A","B","C","D","E"],"rawAnswer":"ABCDE","pages":[185,186],"notes":[]},{"id":"multiple-292","type":"multiple","number":292,"stem":"儿童胸围测量注意事项有（）","options":[{"label":"A","text":"软尺轻轻接触皮肤，不压迫"},{"label":"B","text":"软尺需平整无折叠，左右对称"},{"label":"C","text":"在平静呼气末读数"},{"label":"D","text":"纠正儿童耸肩、挺胸等错误姿势"},{"label":"E","text":"3 岁以上儿童可在深吸气状态下测量"}],"answer":["A","B","C","D"],"rawAnswer":"ABCD","pages":[186],"notes":[]},{"id":"multiple-293","type":"multiple","number":293,"stem":"儿童体格围度测量前准备工作包含（）","options":[{"label":"A","text":"准备校正后的软尺、记录表、笔"},{"label":"B","text":"营造安静、明亮、温暖的环境"},{"label":" ge","number":232,"stem":"高脂血症患者应将 BMI 控制在 26kg/m² 以内。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["F"],"rawAnswer":"错","pages":[245],"notes":[]},{"id":"judge-233","type":"judge","number":233,"stem":"脑卒中最主要的危险因素是高血压。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["T"],"rawAnswer":"对","pages":[245],"notes":[]},{"id":"judge-234","type":"judge","number":234,"stem":"冠心病的一级预防包括合理膳食、防止超重和肥胖。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["T"],"rawAnswer":"对","pages":[245,246],"notes":[]},{"id":"judge-235","type":"judge","number":235,"stem":"糖尿病患者膳食中碳水化合物应占总能量的 50%～65%。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["T"],"rawAnswer":"对","pages":[246],"notes":[]},{"id":"judge-236","type":"judge","number":236,"stem":"痛风患者首先应考虑快速减重，体重减轻速度大于 5 kg 最好。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["F"],"rawAnswer":"错","pages":[246],"notes":[]},{"id":"judge-237","type":"judge","number":237,"stem":"食品中活菌数达 10⁸ CFU/g 时，可认为处于初期腐败阶段。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["T"],"rawAnswer":"对","pages":[246],"notes":[]},{"id":"judge-238","type":"judge","number":238,"stem":"黄曲霉毒素易溶于水，因此在水中容易清洗去除。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["F"],"rawAnswer":"错","pages":[246],"notes":[]},{"id":"judge-239","type":"judge","number":239,"stem":"大肠菌群可作为所有食品的粪便污染指示菌，包括冷冻食品。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["F"],"rawAnswer":"错","pages":[246],"notes":[]},{"id":"judge-240","type":"judge","number":240,"stem":"所有真菌毒素都具有抗原性，能刺激机体产生抗体。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["F"],"rawAnswer":"错","pages":[246],"notes":[]},{"id":"judge-241","type":"judge","number":241,"stem":"有机磷农药在生物体内易分解，因此很少引起慢性中毒。","options":[{"label":"T","text":"正确"},{"label":"F","text":"错误"}],"answer":["T"],"rawAnswer":"对","pages":[246],"notes":[]},   <script type="module">
/** Pure practice state. No network, storage or DOM access. */
const STORAGE_KEY = 'nutrition-workbench:v1';
const SCHEMA_VERSION = 1;
const MODES = new Set(['sequential', 'random', 'wrong', 'bookmarks', 'search']);
const TYPES = new Set(['all', 'single', 'multiple', 'judge']);
const STATUSES = new Set(['draft', 'submitted', 'revealed']);
const now = () => new Date().toISOString();
const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const fail = message => { throw new Error(message); };
const sameSet = (a, b) => a.length === b.length && a.every(value => b.includes(value));

function indexBank(bank) {
  if (!bank || typeof bank.id !== 'string' || !Array.isArray(bank.questions)) fail('题库数据无效');
  return new Map(bank.questions.map(question => [question.id, question]));
}

function revise(state, mutate) {
  const next = structuredClone(state);
  mutate(next);
  next.savedAt = now();
  return next;
}

function currentQuestion(state, bank) {
  if (state.bankId !== bank.id) fail('练习记录与当前题库不匹配');
  const session = state.session;
  if (!session || !session.ids.length) fail('当前没有可练习的题目');
  const question = indexBank(bank).get(session.ids[session.index]);
  if (!question) fail('当前题目不存在');
  return question;
}

function responseFor(state, id) {
  return state.session.responses[id] || { selected: [], status: 'draft', correct: null };
}

function assertId(id) {
  if (typeof id !== 'string' || !id.length || ['__proto__', 'constructor', 'prototype'].includes(id)) fail('题目编号无效');
}

function createState(bank) {
  indexBank(bank);
  return {
    schemaVersion: SCHEMA_VERSION,
    bankId: bank.id,
    records: {},
    wrongIds: [],
    bookmarks: [],
    session: null,
    savedAt: now(),
  };
}

function startSession(state, bank, { mode = 'sequential', type = 'all', ids } = {}) {
  const questions = indexBank(bank);
  if (state.bankId !== bank.id) fail('练习记录与当前题库不匹配');
  if (!MODES.has(mode) || !TYPES.has(type)) fail('练习方式无效');
  if (ids !== undefined && (!Array.isArray(ids) || ids.some(id => !questions.has(id)))) fail('练习题目编号无效');
  let pool = ids === undefined ? bank.questions.map(question => question.id) : [...new Set(ids)];
  if (mode === 'wrong') pool = pool.filter(id => state.wrongIds.includes(id));
  if (mode === 'bookmarks') pool = pool.filter(id => state.bookmarks.includes(id));
  if (type !== 'all') pool = pool.filter(id => questions.get(id).type === type);
  if (mode === 'random') {
    for (let i = pool.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  return revise(state, next => {
    next.session = { mode, type, ids: pool, index: 0, responses: {} };
  });
}

function selectAnswer(state, bank, label) {
  const question = currentQuestion(state, bank);
  if (!question.options.some(option => option.label === label)) fail('选项不存在');
  const response = responseFor(state, question.id);
  if (response.status !== 'draft') return state;
  return revise(state, next => {
    const selected = question.type === 'multiple'
      ? question.options.filter(option => option.label === label ? !response.selected.includes(label) : response.selected.includes(option.label)).map(option => option.label)
      : [label];
    next.session.responses[question.id] = { selected, status: 'draft', correct: null };
  });
}

function submitAnswer(state, bank) {
  const question = currentQuestion(state, bank);
  const response = responseFor(state, question.id);
  if (response.status !== 'draft') return state;
  if (!response.selected.length) fail('请先选择答案');
  const correct = sameSet(response.selected, question.answer);
  return revise(state, next => {
    const previous = next.records[question.id];
    next.records[question.id] = {
      attempts: (previous?.attempts || 0) + 1,
      correct: (previous?.correct || 0) + Number(correct),
      lastAnswer: [...response.selected],
      lastCorrect: correct,
      lastSubmittedAt: now(),
    };
    next.session.responses[question.id] = { selected: [...response.selected], status: 'submitted', correct };
    if (!correct && !next.wrongIds.includes(question.id)) next.wrongIds.push(question.id);
  });
}

function revealAnswer(state, bank) {
  const question = currentQuestion(state, bank);
  const response = responseFor(state, question.id);
  if (response.status !== 'draft') return state;
  return revise(state, next => {
    next.session.responses[question.id] = { selected: [...response.selected], status: 'revealed', correct: null };
  });
}

function moveQuestion(state, delta) {
  if (!Number.isInteger(delta)) fail('题目位置无效');
  if (!state.session || !state.session.ids.length) return state;
  const index = Math.max(0, Math.min(state.session.ids.length - 1, state.session.index + delta));
  if (index === state.session.index) return state;
  return revise(state, next => { next.session.index = index; });
}

function toggleBookmark(state, id) {
  assertId(id);
  return revise(state, next => {
    next.bookmarks = next.bookmarks.includes(id)
      ? next.bookmarks.filter(value => value !== id)
      : [...next.bookmarks, id];
  });
}

function markMastered(state, id) {
  assertId(id);
  if (!state.wrongIds.includes(id)) return state;
  return revise(state, next => { next.wrongIds = next.wrongIds.filter(value => value !== id); });
}

function getStats(state) {
  const records = Object.values(state.records);
  const totalAttempts = records.reduce((total, record) => total + record.attempts, 0);
  const correctAttempts = records.reduce((total, record) => total + record.correct, 0);
  return {
    practiced: records.length,
    totalAttempts,
    correctAttempts,
    accuracy: totalAttempts ? (correctAttempts / totalAttempts) * 100 : 0,
    wrong: state.wrongIds.length,
    bookmarks: state.bookmarks.length,
  };
}

function exportBackup(state) {
  return JSON.stringify(state, null, 2);
}

function validDate(value) {
  if (typeof value !== 'string') return false;
  const time = Date.parse(value);
  return Number.isFinite(time) && new Date(time).toISOString() === value;
}

function validateBackup(text, bank) {
  const questions = indexBank(bank);
  if (typeof text !== 'string' || text.length > 10 * 1024 * 1024) fail('备份文件无效或过大');
  let source;
  try { source = JSON.parse(text); } catch { fail('备份不是有效的 JSON 文件'); }
  if (!isObject(source)) fail('备份格式无效');
  if (source.schemaVersion !== SCHEMA_VERSION) fail('备份版本不兼容');
  if (source.bankId !== bank.id) fail('这份备份属于其他题库');
  if (!validDate(source.savedAt)) fail('备份保存时间无效');
  if (!isObject(source.records)) fail('备份答题记录无效');
  const knownId = id => {
    if (typeof id !== 'string' || !questions.has(id)) fail('备份包含未知题目');
    return id;
  };
  const ids = (value, label) => {
    if (!Array.isArray(value) || value.length > questions.size || new Set(value).size !== value.length) fail(`备份${label}无效`);
    return value.map(knownId);
  };
  const selection = (value, question, allowEmpty = false) => {
    const labels = question.options.map(option => option.label);
    if (!Array.isArray(value) || (!allowEmpty && !value.length) || new Set(value).size !== value.length
      || value.some(label => typeof label !== 'string' || !labels.includes(label))
      || (question.type !== 'multiple' && value.length > 1)) fail('备份答案选项无效');
    return [...value];
  };
  const result = {
    schemaVersion: SCHEMA_VERSION,
    bankId: bank.id,
    records: {},
    wrongIds: ids(source.wrongIds, '错题列表'),
    bookmarks: ids(source.bookmarks, '收藏列表'),
    session: null,
    savedAt: source.savedAt,
  };
  for (const [id, record] of Object.entries(source.records)) {
    knownId(id);
    if (!isObject(record) || !Number.isSafeInteger(record.attempts) || record.attempts < 1
      || !Number.isSafeInteger(record.correct) || record.correct < 0 || record.correct > record.attempts
      || typeof record.lastCorrect !== 'boolean' || !validDate(record.lastSubmittedAt)) fail('备份答题统计无效');
    const question = questions.get(id);
    const answer = selection(record.lastAnswer, question);
    if (record.lastCorrect !== sameSet(answer, question.answer)
      || (record.lastCorrect && record.correct < 1)
      || (!record.lastCorrect && record.attempts === record.correct)) fail('备份答题结果不一致');
    result.records[id] = {
      attempts: record.attempts,
      correct: record.correct,
      lastAnswer: answer,
      lastCorrect: record.lastCorrect,
      lastSubmittedAt: record.lastSubmittedAt,
    };
  }
  if (result.wrongIds.some(id => !result.records[id] || result.records[id].attempts === result.records[id].correct)) fail('备份错题与作答记录不一致');
  if (source.session !== null) {
    const session = source.session;
    if (!isObject(session) || !MODES.has(session.mode) || !TYPES.has(session.type) || !isObject(session.responses)) fail('备份练习会话无效');
    const sessionIds = ids(session.ids, '练习题目列表');
    if (session.type !== 'all' && sessionIds.some(id => questions.get(id).type !== session.type)) fail('备份练习题型不一致');
    if (!Number.isSafeInteger(session.index) || session.index < 0 || (sessionIds.length ? session.index >= sessionIds.length : session.index !== 0)) fail('备份练习位置无效');
    const responses = {};
    for (const [id, response] of Object.entries(session.responses)) {
      knownId(id);
      if (!sessionIds.includes(id) || !isObject(response) || !STATUSES.has(response.status)) fail('备份练习答案无效');
      const question = questions.get(id);
      const selected = selection(response.selected, question, response.status !== 'submitted');
      if (response.status === 'submitted') {
        const record = result.records[id];
        if (typeof response.correct !== 'boolean' || response.correct !== sameSet(selected, question.answer)
          || !record || record.lastCorrect !== response.correct || !sameSet(record.lastAnswer, selected)) fail('备份已提交答案不一致');
      } else if (response.correct !== null) fail('备份未提交答案状态无效');
      responses[id] = { selected, status: response.status, correct: response.correct };
    }
    result.session = { mode: session.mode, type: session.type, ids: sessionIds, index: session.index, responses };
  }
  return result;
}

 return button(`<span class="option-label">${q.type==='judge'?icon(o.label==='T'?'check':'close'):escapeHtml(o.label)}</span><span class="option-text">${escapeHtml(o.text)}</span>${correct?icon('check','answer-icon'):incorrect?icon('close','answer-icon'):''}`,'select',css,`data-label="${o.label}" aria-pressed="${selected}" ${done?'disabled':''}`);
 }).join('')}</div>
 ${done?`<section class="result-panel ${r.status==='revealed'?'revealed':r.correct?'':'wrong'}" role="status"><div class="result-title">${icon(r.status==='revealed'?'book':r.correct?'check':'info')}${r.status==='revealed'?'原文答案':r.correct?'答对了，继续保持':'这道题，值得再想一次'}</div><div class="result-answer">正确答案：<strong>${escapeHtml(answerText)}</strong>${r.status==='submitted'?`<br>你的选择：${escapeHtml(chosenText)}`:''}</div><small>${r.status==='revealed'?'本次仅查看答案，不计入已练题数与正确率。':r.correct?'本次作答已记录。':'已收入错题本，确认记住后可标记「已掌握」。'}<br>答案来自原 PDF，原文未提供解析。</small>${wrong?button(`${icon('check')} 我已掌握，移出错题本`,'mastered','text-button'):''}</section>`:''}
 <div class="source-detail">${q.notes.map(n=>`<p class="source-warning">${escapeHtml(n)}</p>`).join('')}<p>来自《公共营养师》题库 · 原题号与页码按原文保留。</p></div>
 <div class="practice-tools">${button(`${icon('back')} 上一题`,'previous','text-button',s.index===0?'disabled':'')}${button('跳到指定位置','jump','text-button')}${!done?button('先跳过这一题','next','text-button'):''}</div>
 </main><footer class="practice-footer">${button(done?'回到首页':'看答案',done?'nav':'reveal','secondary',done?'data-screen="home"':'')}${button(done?(s.index===s.ids.length-1?'查看本轮小结':'下一题'):'提交答案',done?'next':'submit','primary',!done&&!r.selected.length?'disabled':'')}</footer>`;
}
function finishedPage() {
 const s=state.session;
 const responses=Object.values(s?.responses||{});
 const answered=responses.filter(r=>r.status==='submitted');
 const correct=answered.filter(r=>r.correct).length;
 return `<div class="shell">${header()}<main class="finished"><div class="finish-icon">${icon('leaf')}</div><div class="eyebrow">ONE STEP FURTHER</div><h1>这一轮，辛苦了。</h1><p>本轮共 ${s?.ids.length||0} 道题<br>已提交 ${answered.length} 道 · 答对 ${correct} 道 · 查看答案 ${responses.filter(r=>r.status==='revealed').length} 道<br>已跳过 ${(s?.ids.length||0)-responses.filter(r=>r.status!=='draft').length} 道</p><div class="stats-row"><div class="stat"><div class="stat-value">${answered.length?Math.round(correct/answered.length*100):0}<span>%</span></div><small>本轮正确率</small></div><div class="stat"><div class="stat-value">${answered.length-correct}</div><small>本轮答错</small></div><div class="stat"><div class="stat-value">${state.wrongIds.length}</div><small>待温习错题</small></div></div><div class="settings-actions" style="justify-content:center;margin-top:30px">${button('回到首页','nav','primary','data-screen="home"')}${button('再练一轮','restart','secondary')}${button('温习错题','nav','secondary','data-screen="wrong"')}</div></main></div>${navigation()}`;
}
function settingsPage() {
 const stats=getStats(state);
 return `${button(`${icon('back')} 返回练习首页`,'nav','back-label','data-screen="home"')}<div class="page-head"><div class="eyebrow">YOUR OWN LEARNING JOURNEY</div><h1>我的记录</h1><p>一点一滴的积累，记得留一份备份。</p></div>
 <section class="settings-card"><h2>进度保存在这台设备上 <span class="badge">本机保存</span></h2><p>已练 ${stats.practiced} 题 · 作答 ${stats.totalAttempts} 次 · 收藏 ${stats.bookmarks} 题<br>记录只保存在当前浏览器，不会上传。更换设备、浏览器或清理浏览器数据后，需导入备份恢复。建议固定使用同一个浏览器打开。</p><div class="settings-actions">${button(`${icon('download')} 导出进度备份`,'export','primary')}${button(`${icon('upload')} 导入备份`,'import','secondary')}</div><input type="file" id="backup-file" accept=".json,application/json" hidden></section>
 ${invalidStoredText!==null?`<section class="settings-card"><h2>原记录已保留</h2><p>原记录无法读取，尚未被覆盖。${temporarySaved?'目前的新练习暂存在页面内，请先导出进度备份。':''}你可以下载原记录留存，再确认保存当前进度或重新开始。</p><div class="settings-actions">${button('下载原记录','export-raw','secondary')}${button('保留当前进度并覆盖原记录','replace-corrupt','secondary')}</div></section>`:''}
 <section class="settings-card"><h2>关于这份题库</h2><p>来源：《公共营养师》题库 PDF，共 272 页。<br>单选 439 道 · 多选 413 道 · 判断 464 道。<br>判断题原文缺少第 455 题，实际共 1316 题；单选第 219 题选项为 A/B/C/F，按原文保留。<br>题目及参考答案按原文收录，未提供解析，未对专业结论作勘误。</p></section>
 <section class="settings-card"><h2>怎样计算进度</h2><p>已练题数按提交过的题目去重计算；正确率按所有已提交作答次数计算。多选必须与原答案完全一致。直接「看答案」不计分。错题答对后仍保留，由你手动标记掌握。</p></section>
 <section class="settings-card"><h2>重新开始</h2><p>清空本浏览器中的作答、错题、收藏和当前位置。清空前请先导出备份。</p><div class="settings-actions">${button('清空全部练习记录','reset','secondary danger')}</div></section><p class="footer-note">公共营养师练习工作台 · v1.0</p>`;
}
function begin(mode,type='all',ids,initialIndex=0) {
 const proceed=()=>{
  persist(startSession(state,bank,{mode,type,...(ids?{ids}:{})}));
  if(initialIndex) persist(moveQuestion(state,initialIndex));
  screen='practice'; render({top:true});
 };
 if(state.session?.ids.length) confirmModal('开始新的练习？','将替换当前练习位置和本轮顺序。已记录的作答、错题和收藏会保留。','开始新练习',proceed);
 else proceed();
}
function openModal(content) {
 closeModal();
 modalReturnFocus=document.activeElement;
 const overlay=document.createElement('div'); overlay.className='modal-overlay'; overlay.id='modal-overlay';
 overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${content}</section>`;
 document.body.append(overlay);
 document.body.style.overflow='hidden';
 overlay.querySelector('button,input')?.focus();
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
}
function closeModal() {
 const existing=document.getElementById('modal-overlay');
 if(!existing)return;
 existing.remove(); document.body.style.overflow='';
 if(modalReturnFocus?.isConnected) modalReturnFocus.focus({preventScroll:true});
}
function confirmModal(title,desc,confirmLabel,onConfirm) {
 openModal(`<h2 id="modal-title">${escapeHtml(title)}</h2><p>${escapeHtml(desc)}</p><div class="modal-actions">${button('取消','close-modal','secondary')}${button(escapeHtml(confirmLabel),'confirm-modal','primary')}</div>`);
 document.querySelector('[data-action="confirm-modal"]').onclick=()=>{closeModal();onConfirm();};
 document.querySelector('[data-action="close-modal"]').focus();
}
function chooseType(type) {
 openModal(`<h2 id="modal-title">${typeInfo[type]}</h2><p>${bank.counts[type]} 道原题，选一种适合现在的节奏。</p><div class="mode-options">${button(`${icon('book')}<span><strong>顺序练习</strong><small>按原题顺序，稳稳向前</small></span>`,'start-sequential','mode-button',`data-type="${type}"`)}${button(`${icon('random')}<span><strong>随机练习</strong><small>每轮不重复，检验真实记忆</small></span>`,'start-random','mode-button',`data-type="${type}"`)}</div>${button('再想想','close-modal','modal-close')}`);
}
function downloadText(text,filename) {
 const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));
 const a=document.createElement('a'); a.href=url; a.download=filename; document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function exportProgress() {
 const date=new Date();
 const stamp=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
 downloadText(exportBackup(state),`营养师练习-进度备份-${stamp}.json`);
 toast('已生成备份，请保存到手机文件中');
}
function nextQuestion(delta) {
 if(!state.session)return;
 if(delta>0&&state.session.index===state.session.ids.length-1){screen='finished';render({top:true});return;}
 persist(moveQuestion(state,delta)); render({top:true});
}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-action]');
 if(!target || target.disabled) return;
 const action=target.dataset.action;
 try {
  if(action==='nav') {screen=target.dataset.screen;listType='all';query='';visibleCount=40;render({top:true});}
  else if(action==='resume'){screen='practice';render({top:true});}
  else if(action==='start-all')begin('sequential');
  else if(action==='random-all')begin('random');
  else if(action==='choose-type')chooseType(target.dataset.type);
  else if(action==='start-sequential'||action==='start-random'){const type=target.dataset.type;closeModal();begin(action==='start-random'?'random':'sequential',type);}
  else if(action==='filter'){listType=target.dataset.type;visibleCount=40;render();}
  else if(action==='load-more'){visibleCount+=40;render();}
  else if(action==='practice-list'||action==='open-question'){
   const ids=filterQuestions().map(q=>q.id);
   const idx=action==='open-question'?ids.indexOf(target.dataset.id):0;
   begin(screen==='search'?'search':screen,listType,ids,Math.max(0,idx));
  }
  else if(action==='select'){persist(selectAnswer(state,bank,target.dataset.label));render();}
  else if(action==='submit'){persist(submitAnswer(state,bank));render();requestAnimationFrame(()=>document.querySelector('.result-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'}));}
  else if(action==='reveal'){persist(revealAnswer(state,bank));render();requestAnimationFrame(()=>document.querySelector('.result-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'}));}
  else if(action==='bookmark'){const id=getCurrent().q.id;persist(toggleBookmark(state,id));render();toast(state.bookmarks.includes(id)?'已收藏，留给自己再看一遍':'已取消收藏');}
  else if(action==='mastered'){persist(markMastered(state,getCurrent().q.id));render();toast('已移出错题本，继续保持');}
  else if(action==='previous')nextQuestion(-1);
  else if(action==='next')nextQuestion(1);
  else if(action==='restart'){const {mode,type,ids}=state.session;begin(mode,type,ids);}
  else if(action==='jump'){
   openModal(`<h2 id="modal-title">跳到指定位置</h2><p>输入本轮位置（1–${state.session.ids.length}），不是原题号。</p><div class="search-box"><input id="jump-position" type="number" inputmode="numeric" min="1" max="${state.session.ids.length}" value="${state.session.index+1}" style="padding-left:16px" aria-label="本轮位置"></div><div class="modal-actions">${button('取消','close-modal','secondary')}${button('跳转','jump-confirm','primary')}</div>`);
   document.getElementById('jump-position').focus();
  }
  else if(action==='jump-confirm'){
   const v=Number(document.getElementById('jump-position').value);
   if(!Number.isInteger(v)||v<1||v>state.session.ids.length){toast('请输入本轮范围内的整数');return;}
   persist(moveQuestion(state,v-1-state.session.index));closeModal();render({top:true});
  }
  else if(action==='close-modal')closeModal();
  else if(action==='export')exportProgress();
  else if(action==='export-raw')downloadText(invalidStoredText,'营养师练习-原记录.json');
  else if(action==='import')document.getElementById('backup-file').click();
  else if(action==='replace-corrupt')confirmModal('保存当前进度？','这会覆盖之前无法读取的原记录。建议先下载原记录留存。','确认覆盖',()=>{preventOverwrite=false;invalidStoredText=null;persist(state);render();toast(storageWarning?'保存失败，请导出备份':'当前进度已保存');});
  else if(action==='reset')confirmModal('清空全部练习记录？','将清除当前浏览器的作答、错题、收藏和练习位置。此操作不能撤回，请先导出备份。','确认清空',()=>{preventOverwrite=false;invalidStoredText=null;persist(createState(bank));render({top:true});toast(storageWarning?'清空未保存，请勿关闭页面':'练习记录已清空');});
 } catch(error){toast(error.message||'操作未完成，请重试');}
});
function updateSearch(input) {
 query=input.value;visibleCount=40;
 // Keep the live input node and its mobile Chinese IME composition intact.
 const fragment=document.createElement('template');
 fragment.innerHTML=listPage();
 const replacement=fragment.content.querySelector('#list-results');
 const previous=document.getElementById('list-results');
 if(previous&&replacement)previous.replaceWith(replacement);
}
document.addEventListener('input',e=>{
 if(e.target.id==='query'&&!e.isComposing)updateSearch(e.target);
});
document.addEventListener('compositionend',e=>{
 if(e.target.id==='query')updateSearch(e.target);
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='backup-file')return;
 const file=e.target.files?.[0]; e.target.value='';
 if(!file)return;
 try {
  if(file.size>10*1024*1024)throw new Error('备份文件过大，请选择本工作台导出的 JSON 文件');
  const imported=importBackup(await file.text(),bank);
  const stats=getStats(imported);
  confirmModal('导入这份备份？',`备份包含已练 ${stats.practiced} 题、错题 ${stats.wrong} 题、收藏 ${stats.bookmarks} 题。\n确认后将覆盖当前全部记录，不会合并；建议先导出当前进度。`,'确认导入',()=>{
   preventOverwrite=false;invalidStoredText=null;persist(imported);screen='home';render({top:true});toast(storageWarning?'备份已载入，浏览器保存失败，请及时导出':'备份已恢复，可以继续练习');
  });
 } catch(error){toast(`导入失败：${error.message}`);}
});
document.addEventListener('keydown',e=>{
 const overlay=document.getElementById('modal-overlay');
 if(!overlay)return;
 if(e.key==='Escape'){e.preventDefault();closeModal();}
 if(e.key==='Tab'){
  const focusable=[...overlay.querySelectorAll('button:not(:disabled),input,a[href]')];
  const first=focusable[0],last=focusable.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
 }
});
window.addEventListener('storage',e=>{
 if(e.key!==STORAGE_KEY)return;
 try {
  state=e.newValue?restoreState(e.newValue,bank):createState(bank);
  invalidStoredText=null;preventOverwrite=false;storageWarning='';
  if(screen==='practice'&&!state.session?.ids.length)screen='home';
  render();toast('已同步此浏览器另一页面的最新记录');
 } catch {storageWarning='另一个页面保存的记录无法读取，当前记录仍在，请先导出备份。';preventOverwrite=true;render();}
});
render();

  </script>
</body>
</html>
